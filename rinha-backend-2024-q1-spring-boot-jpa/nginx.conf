events {
    worker_connections 10000;
}

http {
    access_log off;
    sendfile   on;

    upstream api {
        server api01:3000 fail_timeout=60;
        server api02:3000 fail_timeout=60;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
        }
    }
}