version: '3.8'

services:
  app:
    build:
      context: .
    command: bash start.sh
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      GRADLE_USER_HOME: /box
    volumes:
      - .:/reactve-flascards
      - box:/box
    depends_on:
      - db
  db:
    image: mongo:7.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: reactve-flascards
      MONGO_INITDB_ROOT_PASSWORD: reactve-flascards
      MONGO_INITDB_DATABASE: reactve-flascards
    ports:
      - "27017:27017"
  box:
    image: busybox
    volumes:
      - /box
volumes:
  db:
  box: